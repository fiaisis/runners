---
name: Check for new runners and build a new mantid one

on:
  schedule:
    - cron: "18 14 * * *"
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  mantid-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4.1.1

      - name: Find latest release, check if it's in the bash file, add a new one.
        id: latest_version
        run: |
          RESPONSE=$(curl -s https://api.github.com/repos/mantidproject/mantid/releases/latest)
          
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty')

          # Error handling: Exit if no valid tag found
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "::warning::No valid tag found (API returned '$TAG'). Skipping build."
            echo "build_latest_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip 'v' prefix ONLY if present (e.g., v6.14.0 -> 6.14.0)
          if [[ "$TAG" == v* ]]; then
            TAG="${TAG:1}"
          fi
          
          echo "Tag determined: $TAG"

          TOKEN=$(curl --location --request GET 'https://ghcr.io/token?scope=repository:fiaisis/mantid:pull' | jq -r '.token')
          CONTAINER_VERSIONS=$(curl --location --request GET 'https://ghcr.io/v2/fiaisis/mantid/tags/list' --header "Authorization: Bearer $TOKEN" | jq -r '.tags')
          
          echo "Versions found: $CONTAINER_VERSIONS, tag found: $TAG"
          
          if [[ $CONTAINER_VERSIONS != *"$TAG"* ]]; then
            echo "New version detected. Building $TAG."
            echo "build_latest_version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Version $TAG already exists. Skipping."
            echo "build_latest_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.WRITE_PACKAGE_TOKEN }}

      - name: Build and push mantid runner docker image
        id: docker_build
        uses: docker/build-push-action@v5
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        with:
          file: ./mantid/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mantid:${{ steps.latest_version.outputs.build_latest_version }}

      - name: Remove sha256 from the builds digest
        id: remove_sha256
        run: |
          DIGEST=${{ steps.docker_build.outputs.digest }}
          FILTERED_DIGEST=${DIGEST#sha256:}
          echo "::set-output name=digest::$FILTERED_DIGEST"

      - name: Checkout the Gitops repository
        uses: actions/checkout@v4
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        with:
          repository: fiaisis/gitops
          token: ${{ secrets.GITOPS_STAGING_EDIT_TOKEN }}

      - name: Edit the YAML jobcreator.yml file for staging for adding runners
        uses: mikefarah/yq@v4.44.1
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        with:
          cmd: yq e -i '.spec.template.spec.containers[] |= (select(.name == "jobcreator") | .env[] |= select(.name == "DEFAULT_RUNNER_SHA").value = "${{ steps.remove_sha256.outputs.digest }}")' './components/jobcreator/envs/staging/jobcreator.yml'

      - name: Checkout the LLSP Repo
        uses: actions/checkout@v4
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        with:
          repository: fiaisis/LLSP
          token: ${{ secrets.GITOPS_STAGING_EDIT_TOKEN }}
          path: llsp_repo

      - name: Update Dockerfile in LLSP
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mantid:${{ steps.latest_version.outputs.build_latest_version }}"
          
          # Target the Dockerfile inside the subdirectory
          sed -i "s|^FROM .*|FROM $NEW_IMAGE|" ./llsp_repo/LLSP-Worker/Dockerfile

      - name: Commit and Push to LLSP
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mantid:${{ steps.latest_version.outputs.build_latest_version }}"
          
          # Navigate in, commit, and push specifically for this repo
          cd llsp_repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "[CD] Update base image for LLSP to $NEW_IMAGE"
          git push

      - name: Checkout the script analysis service
        uses: actions/checkout@v4
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        with:
          repository: fiaisis/mantid-python-script-lsp
          token: ${{ secrets.GITOPS_STAGING_EDIT_TOKEN }}
          path: lsp_repo

      - name: Update Dockerfile in the script analysis service
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        run: |
          # That repo pins its base through build args (FROM ${RUNNER_IMAGE}:${RUNNER_TAG}), so the version
          # to rewrite is the RUNNER_TAG default. Rewriting the FROM line the way the LLSP step above does
          # would hard-code the image and leave RUNNER_TAG claiming a version the build no longer uses.
          sed -i -E "s|^ARG RUNNER_TAG=.*|ARG RUNNER_TAG=${{ steps.latest_version.outputs.build_latest_version }}|" ./lsp_repo/container/mantid_python_script_lsp.D
          grep -n "^ARG RUNNER" ./lsp_repo/container/mantid_python_script_lsp.D

      - name: Commit and Push to the script analysis service
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mantid:${{ steps.latest_version.outputs.build_latest_version }}"

          cd lsp_repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Skip quietly when the pin has not moved, rather than failing the run: a commit that pushes to
          # this repo re-runs this workflow, and by then the pin is already current. That push matters, the
          # analysis service publishes its own image and pins staging's digest when main moves.
          if git diff --quiet -- container/mantid_python_script_lsp.D; then
            echo "Base image already at $NEW_IMAGE; nothing to commit."
          else
            git commit -am "[CD] Update base image for mantid-python-script-lsp to $NEW_IMAGE"
            git push
          fi

      - name: Commit and push changes
        if: ${{ steps.latest_version.outputs.build_latest_version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "[CD] Update jobcreator with this commit ${{ github.event.head_commit.url}}"
          git push
